name: Build TommyRootDNS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile native DNS53 root helper
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/26.3.11579264"
          TC="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SRC="native/rootdns53.c"

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          "${TC}/aarch64-linux-android24-clang" \
            -std=c11 -Os -Wall -Wextra -Werror -fPIE -pie -fvisibility=hidden -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -Wl,--strip-all -pthread \
            "${SRC}" -o app/src/main/jniLibs/arm64-v8a/libtdns53.so

          "${TC}/armv7a-linux-androideabi24-clang" \
            -std=c11 -Os -Wall -Wextra -Werror -fPIE -pie -fvisibility=hidden -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -Wl,--strip-all -pthread \
            "${SRC}" -o app/src/main/jniLibs/armeabi-v7a/libtdns53.so

          file app/src/main/jniLibs/arm64-v8a/libtdns53.so
          file app/src/main/jniLibs/armeabi-v7a/libtdns53.so
          sha256sum app/src/main/jniLibs/*/libtdns53.so

      - name: Prepare optional release signing
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${KS_B64}" && -n "${KS_PASS}" && -n "${KS_ALIAS}" && -n "${KEY_PASS}" ]]; then
            mkdir -p .ci
            printf '%s' "${KS_B64}" | base64 --decode > .ci/release.jks

            echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/.ci/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${KS_PASS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${KS_ALIAS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"

            CERT_SHA="$({
              keytool -exportcert \
                -alias "${KS_ALIAS}" \
                -keystore .ci/release.jks \
                -storepass "${KS_PASS}"
            } | openssl dgst -sha256 | awk '{print $2}')"

            echo "EXPECTED_CERT_SHA256=${CERT_SHA}" >> "$GITHUB_ENV"
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            echo "Release signing secrets are not configured."
            echo "The installable obfuscated test APK will still be generated."
          fi

      - name: Build obfuscated APKs
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if gradle --no-daemon --stacktrace --max-workers=2 \
              clean :app:assembleDebug :app:assembleRelease; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          if [[ -f app/build/outputs/apk/debug/app-debug.apk ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
              dist/TommyRootDNS-v1.8-test-obfuscated.apk
          fi

          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk \
              dist/TommyRootDNS-v1.8-release-signed.apk
          elif [[ -f app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
              dist/TommyRootDNS-v1.8-release-unsigned.apk
          fi

          if ! compgen -G "dist/*.apk" > /dev/null; then
            echo "No APK was produced."
            exit 1
          fi

          {
            echo "Project: TommyRootDNS"
            echo "Version: 1.8.0 (9)"
            echo "Gradle: 8.13"
            echo "Android compile SDK: 35"
            echo "Android min SDK: 24"
            echo "Android target SDK: 28"
            echo "Modes: automatic root/iptables + native UDP53-to-TCP5454 bridge + netd resolver + VPN fallback"
            echo "Native DNS53 helper: arm64-v8a + armeabi-v7a (NDK 26.3)"
            echo "Release signing configured: ${SIGNED_RELEASE:-false}"
          } > dist/BUILD-INFO.txt

          sha256sum app/src/main/jniLibs/*/libtdns53.so > dist/NATIVE-HELPER-SHA256SUMS.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TommyRootDNS-v1.8-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

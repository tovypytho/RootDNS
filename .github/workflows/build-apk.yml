name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare optional release signing
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KS_B64}" && -n "${KS_PASS}" && -n "${KS_ALIAS}" && -n "${KEY_PASS}" ]]; then
            mkdir -p .ci
            printf '%s' "${KS_B64}" | base64 --decode > .ci/release.jks
            echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/.ci/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${KS_PASS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${KS_ALIAS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"

            CERT_SHA=$(keytool -exportcert -alias "${KS_ALIAS}" -keystore .ci/release.jks -storepass "${KS_PASS}" \
              | openssl dgst -sha256 | awk '{print $2}')
            echo "EXPECTED_CERT_SHA256=${CERT_SHA}" >> "$GITHUB_ENV"
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "Release signing: enabled"
          else
            echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            echo "Release signing secrets not set. Debug APK will still be installable; release APK will be unsigned."
          fi

      - name: Build obfuscated APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean :app:assembleDebug :app:assembleRelease

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TommyRootDNS-test-obfuscated.apk

          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk dist/TommyRootDNS-release-signed.apk
          elif [[ -f app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/TommyRootDNS-release-unsigned.apk
          fi

          {
            echo "Build type: R8 minified + resource shrinking"
            echo "Release signing configured: ${SIGNED_RELEASE:-false}"
            echo "The test APK is installable and non-debuggable, but its ephemeral debug signing key may change between GitHub runs."
            echo "For stable upgrades, configure the four ANDROID_KEYSTORE_* repository secrets described in README.md."
          } > dist/BUILD-INFO.txt

          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TommyRootDNS-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
